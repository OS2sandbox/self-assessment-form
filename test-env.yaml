apiVersion: v1
kind: Pod
metadata:
  name: os2-self-assessment-test
spec:
  securityContext:
    seLinuxOptions:
      type: spc_t
  containers:
  - name: web
    image: docker.io/library/caddy:2-alpine
    ports:
    - containerPort: 80
      hostPort: 8080
    volumeMounts:
    - name: caddy-config-dir
      mountPath: /etc/caddy/Caddyfile
      subPath: Caddyfile
      readOnly: true
    - name: public-assets
      mountPath: /usr/share/caddy
      readOnly: true
    - name: schema-volume
      mountPath: /usr/share/caddy/schema
    - name: data-volume
      mountPath: /usr/share/caddy/data
  volumes:
  - name: caddy-config-dir
    hostPath:
      path: .
      type: Directory
  - name: public-assets
    hostPath:
      path: .
      type: Directory
  - name: schema-volume
    hostPath:
      path: ./schema
      type: Directory
  - name: data-volume
    hostPath:
      path: ./data
      type: Directory