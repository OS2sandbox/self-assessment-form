<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS2 Self-Assessment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
</head>
<body class="bg-light py-4">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <article class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="form-title">OS2 Governance Self-Assessment</h1>
                        <div id="form"></div>
                        <footer class="action-footer">
                            <button id="save-btn" class="btn btn-success" onclick="saveAndOpen()" disabled>
                                Save & Open in GitHub
                            </button>
                            <button id="download-btn" class="btn btn-primary" onclick="downloadJson()" disabled>
                                Download JSON
                            </button>
                        </footer>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/jedison@1.11.2/dist/umd/jedison.umd.js"></script>
    <script src="app.js" data-schema="schema/test-governance-schema.json"></script>
</body>
</html>
